<style>
  :root{
    --bg:#f7f2e8; --card:#fffdf8; --ink:#2b2118; --sub:#7d6c57;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{

  }
  .app{width:100%; max-width:640px}
  .card{

    box-shadow:0 10px 30px rgba(80,60,30,.08); padding:26px 22px;
  }
  h1{font-size:1.4rem; letter-spacing:.04em; text-align:center; line-height:1.5}
  .sub{text-align:center; color:var(--sub); font-size:.85rem; margin-top:10px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:18px 0}
  .btn{
    display:block; width:100%; border:none; cursor:pointer; font-family:inherit;
    background:var(--accent); color:#fff; font-size:1.02rem; padding:15px;
    border-radius:14px; letter-spacing:.06em; margin-top:22px; transition:.2s;
    box-shadow:0 6px 16px rgba(179,64,47,.25);
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent; color:var(--sub); box-shadow:none; border:1px solid var(--line)}
  .btn.secondary{background:var(--accent2); box-shadow:0 6px 16px rgba(138,106,47,.25); margin-top:12px;}
  .btn:disabled{opacity:.4; cursor:default}

  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .back{
    border:1px solid var(--line); background:#fff; border-radius:10px;
    width:42px; height:38px; font-size:1.1rem; color:var(--sub); cursor:pointer; flex:0 0 auto;
  }
  .back:disabled{opacity:.3}
  .prog{flex:1; height:8px; background:#ece2d0; border-radius:99px; overflow:hidden}
  .prog > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--accent)); transition:width .35s}
  .qnum{font-size:.78rem; color:var(--sub); letter-spacing:.12em; margin-bottom:6px}
  .qtext{font-size:1.18rem; line-height:1.6; margin-bottom:18px; font-weight:600}
  .opts{display:grid; gap:10px}
  .opt{
    display:flex; align-items:center; gap:12px; text-align:left; font-family:inherit;
    background:#fff; border:1.5px solid var(--line); border-radius:14px;
    padding:14px 16px; font-size:1rem; color:var(--ink); cursor:pointer; transition:.18s;
  }
  .opt:hover{border-color:var(--gold); background:#fffbf1}
  .opt.on{border-color:var(--accent); background:#fdf1ee; box-shadow:0 0 0 3px rgba(179,64,47,.10)}
  .num{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:#efe6d5;
    color:var(--sub); font-size:.82rem; display:grid; place-items:center; font-weight:700;
  }
  .opt.on .num{background:var(--accent); color:#fff}

  /* result */
  .res-head{text-align:center; padding:8px 0 4px}
  .badge{display:inline-block; font-size:.75rem; letter-spacing:.16em; color:var(--accent2);
    border:1px solid var(--gold); border-radius:99px; padding:3px 14px; margin-bottom:14px}
  .deity{font-size:2.05rem; letter-spacing:.06em; color:var(--accent); font-weight:700; line-height:1.25}
  .reading{color:var(--sub); font-size:.9rem; letter-spacing:.18em; margin-top:4px}
  .oneline{margin-top:14px; font-size:1.05rem; color:var(--ink)}
  .oneline b{color:var(--accent2)}
  .photo{
    margin:18px auto 0; width:min(266px,74%); aspect-ratio:4/5; border-radius:16px;
    overflow:hidden; border:1px solid var(--line); position:relative;
    background:linear-gradient(160deg,#3a3128,#1d1813);
    box-shadow:0 12px 28px rgba(60,40,20,.20);
  }
  .photo img{width:100%; height:100%; object-fit:cover; object-position:center top; display:block}
  .photo .ph{
    position:absolute; inset:0; display:none; place-items:center; text-align:center;
    color:#cbb894; font-size:.78rem; line-height:1.8; padding:18px;
  }
  .photo .ph a{color:#e0cfa4}
  .credit{text-align:center; color:var(--sub); font-size:.7rem; margin-top:8px}
  .credit a{color:var(--accent2)}
  .thumb{
    width:46px; height:58px; border-radius:8px; object-fit:cover;
    object-position:center top; border:1px solid var(--line);
    background:#2a231c; flex:0 0 auto;
  }
  h2.sec{font-size:.85rem; letter-spacing:.14em; color:var(--accent2); margin:22px 0 8px;
    border-left:3px solid var(--gold); padding-left:9px}
  .why{display:grid; gap:10px}
  .wrow{background:#fbf6ec; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:.93rem}
  .wrow .k{font-size:.72rem; letter-spacing:.1em; color:var(--sub); display:block}
  .wrow .v{font-weight:700}
  .wrow .acc{color:var(--accent2)}
  .para{font-size:.95rem; color:#3c3125}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px}
  .chip{background:#f3ead7; color:#6b5738; font-size:.82rem; border-radius:99px; padding:4px 12px}
  .others{display:grid; gap:8px; margin-top:8px}
  .orow{display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-size:.92rem}
  .bar{height:6px; background:#ece2d0; border-radius:99px; overflow:hidden; flex:1 1 60px; max-width:150px}
  .bar > i{display:block; height:100%; background:var(--gold)}
  .foot{text-align:center; color:var(--sub); font-size:.72rem; margin-top:20px; line-height:1.7}
  .fade{animation:f .4s ease}
  @keyframes f{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media(max-width:420px){ .deity{font-size:1.7rem} .card{padding:20px 16px} }

  /* 画面表示時のプリント用隠し要素 */
  .print-footer-info { display: none; }

  /* ============================================================
     1枚出力用 印刷スタイル (CSS Print)
     ============================================================ */
  @media print {
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    body {
      background: #ffffff !important;
      color: #000000 !important;
      padding: 0 !important;
      margin: 0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .app { max-width: 100% !important; width: 100% !important; }
    .card {
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      background: #ffffff !important;
    }
    /* 印刷時に不要なボタンやバーを隠す */
    .no-print, .topbar, .btn {
      display: none !important;
    }
    /* A4 1枚に収めるためのサイズ＆レイアウト調整 */
    .deity { font-size: 1.6rem !important; }
    .reading { font-size: 0.8rem !important; }
    .oneline { font-size: 0.9rem !important; margin-top: 6px !important; }
    .photo {
      width: 160px !important;
      margin: 10px auto 0 !important;
      box-shadow: none !important;
    }
    .credit { font-size: 0.65rem !important; margin-top: 4px !important; }
    h2.sec {
      font-size: 0.8rem !important;
      margin: 10px 0 4px !important;
      padding-left: 6px !important;
    }
    .why { gap: 4px !important; }
    .wrow {
      padding: 6px 10px !important;
      font-size: 0.8rem !important;
    }
    .para { font-size: 0.8rem !important; line-height: 1.4 !important; }
    .chips { margin-top: 4px !important; gap: 4px !important; }
    .chip { font-size: 0.72rem !important; padding: 2px 8px !important; }
    .others { gap: 4px !important; margin-top: 4px !important; }
    .orow { padding: 6px 10px !important; font-size: 0.8rem !important; }
    .thumb { width: 32px !important; height: 40px !important; }
    .foot { font-size: 0.65rem !important; margin-top: 10px !important; line-height: 1.3 !important; }
    
    .print-footer-info {
      display: block !important;
      text-align: center;
      font-size: 0.7rem;
      color: #666;
      border-top: 1px dashed #ccc;
      margin-top: 10px;
      padding-top: 6px;
    }
  }
</style>
</head>

const SB="https://www.sanjusangendo.jp/wp-content/themes/33hp/assets/images/statue/";
function imgInfo(id){
  if(id<=28){
    const p=String(id).padStart(2,"0");
    return { u:SB+"nijuhachibushu/img"+p+".jpg",
             s:SB+"nijuhachibushu/img"+p+".jpg 1x, "+SB+"nijuhachibushu/2x/img"+p+".jpg 2x",
             pg:"https://www.sanjusangendo.jp/statue/nijuhachibushu/" };
  }
  if(id===29) return { u:SB+"senjukannon/img01.jpg",
             s:SB+"senjukannon/img01.jpg 1x, "+SB+"senjukannon/2x/img01.jpg 2x",
             pg:"https://www.sanjusangendo.jp/statue/senjukannon/" };
  const p2 = id===30 ? "img01" : "img02";
  return { u:SB+"fujinraijin/"+p2+".jpg",
           s:SB+"fujinraijin/"+p2+".jpg 1x, "+SB+"fujinraijin/2x/"+p2+".jpg 2x",
           pg:"https://www.sanjusangendo.jp/statue/fujinraijin/" };
}

/* ---------- 採点ロジック ---------- */
const IDS = Object.keys(BU).map(Number);
function compute(a){
  const total={}, q4={}, q5={};
  IDS.forEach(i=>{total[i]=0;q4[i]=0;q5[i]=0;});
  for(let qi=0; qi<5; qi++){
    const m=M[qi], oi=a[qi];
    if(oi==null) continue;
    const e=S[qi][oi];
    for(const k in e){ const s=+k, v=e[k]*m;
      total[s]+=v; if(qi===3)q4[s]+=v; if(qi===4)q5[s]+=v; }
  }
  const ranked=IDS.slice().sort((x,y)=>
    total[y]-total[x] || q5[y]-q5[x] || q4[y]-q4[x] || x-y);
  return {total, ranked};
}

    <div class="prog"><i style="width:${step<0?0:Math.round(((step+1)/5)*100)}%"></i></div>
    <span class="qnum" style="margin:0">${step<0?'START':'Q'+Math.min(step+1,5)+' / 5'}</span>
  </div>`;
}

    ans[step]=+b.dataset.i;
    if(step<4){ step++; render(); } else { step=5; render(); }
  });

}

  document.getElementById('back').onclick=()=>{ step=4; render(); };

function render(){

render();
